# Publica o blog no GitHub Pages a cada push na main (inclusive os commits do painel).
# Antes da primeira vez: Settings → Pages → Source = "GitHub Actions".
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: pages
        uses: actions/configure-pages@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Aponta o painel para este repositório e para o endereço publicado.
      - name: Configurar o painel
        run: |
          sed -i \
            -e "s|^  repo: .*|  repo: ${{ github.repository }}|" \
            -e "s|^  branch: .*|  branch: ${{ github.ref_name }}|" \
            -e "s|^site_url: .*|site_url: ${{ steps.pages.outputs.base_url }}|" \
            -e "s|^display_url: .*|display_url: ${{ steps.pages.outputs.base_url }}|" \
            public/admin/config.yml

      - name: Build
        run: npm run build
        env:
          SITE: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
